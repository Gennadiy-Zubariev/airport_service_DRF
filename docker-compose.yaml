services:
  airport:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - my_media:/files/media
    command: >
      sh -c "python manage.py migrate &
        python manage.py runserver 0.0.0.0:8000"
    depends_on:
      airport_app_db:
          condition: service_healthy

  airport_app_db:
    image: postgres:16.0-alpine3.17
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airport" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - my_db:$PGDATA

volumes:
  my_media:
  my_db:


  
